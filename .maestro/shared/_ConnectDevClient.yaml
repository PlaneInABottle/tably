appId: ${MAESTRO_APP_ID}
---
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn:
          text: "Tably, http.*8081"
          optional: true
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: "Enter URL manually"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "exp://"
    commands:
      - tapOn: "exp://"
      - eraseText: 30
      - inputText: "http://localhost:8081"
      - tapOn: "Connect"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn: "Reload"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "gearshape.fill"
    commands:
      - tapOn:
          id: "gearshape.fill"
      - extendedWaitUntil:
          visible: "Tools button"
          timeout: 5000
      - tapOn: "Tools button"
      - tapOn:
          id: "xmark"
      - waitForAnimationToEnd
