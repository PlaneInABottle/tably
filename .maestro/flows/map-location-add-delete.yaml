appId: ${MAESTRO_APP_ID}
onFlowStart:
  # Note: _OnFlowStart.yaml runs `clearState: true` which is incompatible
  # with the Expo dev launcher. When running against a development build
  # launched via Metro, this flow assumes the user is not already signed
  # in OR that the prior `clearState: true` failed silently (in which case
  # the sign-in steps below will surface the sign-in screen). For IPA
  # builds the `onFlowStart` line is required and is therefore preserved.
  - runFlow: ../shared/_OnFlowStart.yaml
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
  DISPLAY_NAME: ${DISPLAY_NAME}
---
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn:
    id: "sign-in-create-account-button"
- tapOn:
    id: "display-name-input"
- inputText: ${DISPLAY_NAME}
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-up-submit-button"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Map"
    timeout: 30000
# Phase 4: saved-location trigger moved to the Profile screen in
# commit 9668925; the Map FAB was removed in 9e9d580. Route through
# `tab-profile` → `profile-add-saved-location-button`.
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Saved locations"
    timeout: 15000
- swipe:
    start: 50%, 84%
    end: 50%, 38%
    duration: 500
- assertVisible: "Profile add saved location"
- tapOn: "Profile add saved location"
- tapOn:
    id: "location-picker-label-input"
- inputText: "Maestro Private Reef"
- pressKey: Enter
- extendedWaitUntil:
    notVisible: "return"
    timeout: 10000
- tapOn:
    id: "location-picker-save-button"
# After LocationPicker.goBack() the user is on Profile. The rest of this
# flow runs on the Map tab, so switch back before the setLocation step.
- tapOn:
    id: "tab-map"
- extendedWaitUntil:
    visible: "Map"
    timeout: 15000
- takeScreenshot: "phase2-saved-location-created"
- setLocation:
    latitude: 41.015137
    longitude: 28.97953
- setPermissions:
    permissions:
      location: inuse
- tapOn:
    id: "map-use-current-location-button"
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "Allow Once"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "map-search-this-area-button"
- assertNotVisible: "Maestro Private Reef"
- takeScreenshot: "phase2-private-location-hidden"
- tapOn:
    id: "map-save-location-button"
- extendedWaitUntil:
    visible: "Location saved"
    timeout: 30000
- tapOn:
    id: "map-delete-location-button"
- extendedWaitUntil:
    visible: "Location deleted"
    timeout: 30000
- takeScreenshot: "phase2-location-deleted"
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-sign-out-button"
- tapOn: "Confirm sign out"
