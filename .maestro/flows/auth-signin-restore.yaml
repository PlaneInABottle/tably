appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn:
    id: "email-input"
- waitForAnimationToEnd
- inputText: ${EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-submit-button"
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 30000
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Map"
    timeout: 30000
- launchApp:
    clearState: false
    clearKeychain: false
    stopApp: true
- waitForAnimationToEnd
- runFlow: ../shared/_ConnectDevClient.yaml
- extendedWaitUntil:
    visible: "Map"
    timeout: 30000
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-sign-out-button"
- tapOn: "Confirm sign out"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- takeScreenshot: "phase1-signin-restore"
