appId: ${MAESTRO_APP_ID}
env:
  RESET_LINK: ${RESET_LINK}
---
- openLink: ${RESET_LINK}
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "update-password-input"
    timeout: 30000
- assertVisible:
    id: "update-password-confirm-input"
- assertVisible:
    id: "update-password-submit-button"
