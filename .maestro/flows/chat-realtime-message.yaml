appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-submit-button"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Map"
    timeout: 30000
- tapOn:
    id: "tab-chat"
- extendedWaitUntil:
    visible:
      id: "chat-conversation-00000000-0000-4000-8000-000000000402"
    timeout: 30000
- tapOn:
    id: "chat-conversation-00000000-0000-4000-8000-000000000402"
- extendedWaitUntil:
    visible: "Private 1-on-1 conversation"
    timeout: 30000
- runScript:
    file: ../scripts/insert-chat-realtime-message.js
- extendedWaitUntil:
    visible: ${output.realtimeMessageBody}
    timeout: 30000
- assertVisible: "Lena Cruz"
- takeScreenshot: "phase4-chat-realtime-message"
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-sign-out-button"
- tapOn: "Confirm sign out"
