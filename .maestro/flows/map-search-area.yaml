appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-submit-button"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Map"
    timeout: 30000
- assertVisible:
    id: "map-legend"
- setLocation:
    latitude: 41.015137
    longitude: 28.97953
- setPermissions:
    permissions:
      location: inuse
- tapOn:
    id: "map-use-current-location-button"
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "Allow Once"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Location selected"
    timeout: 30000
- tapOn:
    id: "map-search-this-area-button"
- extendedWaitUntil:
    visible:
      id: "map-status"
    timeout: 30000
- assertVisible:
    id: "map-search-results-pill-button"
- tapOn:
    id: "map-search-results-pill-button"
- assertVisible:
    text: "People"
- assertVisible: "Bosphorus Dawn Shelf Dive"
- scrollUntilVisible:
    element:
      id: "map-search-result-person-00000000-0000-4000-8000-000000000202"
    direction: DOWN
    timeout: 10000
- assertNotVisible: "Sofia Marin"
- takeScreenshot: "phase2-map-search-area"
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-sign-out-button"
- tapOn: "Confirm sign out"
