appId: ${MAESTRO_APP_ID}
tags:
  - core
  - table
  - ios
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
  DISPLAY_NAME: ${DISPLAY_NAME}
---
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn:
    id: "sign-in-create-account-button"
- tapOn:
    id: "display-name-input"
- inputText: ${DISPLAY_NAME}
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-up-terms-checkbox"
- tapOn:
    id: "sign-up-submit-button"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Don’t Allow"
    optional: true
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- tapOn:
    id: "tab-create"
- extendedWaitUntil:
    visible: "Create a table"
    timeout: 10000
- tapOn: "Coffee"
- tapOn: "Tomorrow"
- scrollUntilVisible:
    element: "20:30"
    direction: DOWN
    timeout: 10000
- tapOn: "20:30"
- scrollUntilVisible:
    element:
      id: "create-table-submit-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "create-table-submit-button"
- extendedWaitUntil:
    visible: "Table"
    timeout: 30000
- assertVisible: "Coffee table"
- runFlow:
    when:
      visible: "Join this table"
    commands:
      - tapOn: "Join"
      - extendedWaitUntil:
          visible: "Needs intro"
          timeout: 30000
- assertVisible: "Needs intro"
- tapOn:
    id: "table-intro-input"
- inputText: "Easy conversation and a calm coffee plan."
- hideKeyboard
- tapOn:
    id: "table-intro-submit-button"
- extendedWaitUntil:
    visible: "Needs confirm"
    timeout: 30000
- tapOn:
    id: "table-confirm-button"
- extendedWaitUntil:
    visible: "You are confirmed"
    timeout: 30000
- tapOn: "Use prompt Confirm venue"
- extendedWaitUntil:
    visible: "Can we confirm the exact venue?"
    timeout: 10000
- tapOn:
    id: "table-message-send-button"
- extendedWaitUntil:
    visible: "Can we confirm the exact venue?"
    timeout: 30000
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- tapOn:
    id: "table-detail-back-button"
- waitForAnimationToEnd
- tapOn:
    id: "tab-chats"
- extendedWaitUntil:
    visible: "Open Coffee table"
    timeout: 30000
- tapOn:
    id: "tab-today"
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
- tapOn:
    id: "today-list-mode-button"
- assertVisible: "Open Coffee table"
- tapOn:
    id: "today-map-mode-button"
- extendedWaitUntil:
    visible:
      id: "today-map-search-button"
    timeout: 30000
- assertVisible: "Map pin Coffee table"
- takeScreenshot: "tably-core-table-flow"
