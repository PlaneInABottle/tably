appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
---
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn:
    id: "email-input"
- inputText: "${EMAIL}"
- tapOn:
    id: "password-input"
- inputText: "${PASSWORD}"
- hideKeyboard
- tapOn:
    id: "sign-in-submit-button"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Map"
    timeout: 30000
- setLocation:
    latitude: 41.015137
    longitude: 28.97953
- setPermissions:
    permissions:
      location: inuse
- tapOn:
    id: "map-use-current-location-button"
- tapOn:
    text: "Allow While Using App"
    optional: true
- tapOn:
    text: "Allow Once"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Location selected"
    timeout: 30000
- tapOn:
    id: "map-search-this-area-button"
- extendedWaitUntil:
    visible:
      id: "map-status"
    timeout: 30000
- tapOn:
    id: "map-search-results-pill-button"
- extendedWaitUntil:
    visible: "Events"
    timeout: 10000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Bosphorus Dawn Shelf Dive"
    timeout: 10000
- scrollUntilVisible:
    element: "Bosphorus Dawn Shelf Dive"
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "Bosphorus Dawn Shelf Dive"
- extendedWaitUntil:
    visible:
      id: "map-event-detail-card"
    timeout: 10000
- assertVisible: "Dive event detail Bosphorus Dawn Shelf Dive"
- assertNotVisible: "Adalar Bluewater Sweep"
- takeScreenshot: "phase3-map-dive-events"
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-sign-out-button"
- tapOn: "Confirm sign out"
