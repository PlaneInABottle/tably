appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
env:
  EMAIL: ${EMAIL}
---
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn:
    id: "sign-in-forgot-password-button"
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "forgot-password-submit-button"
- assertVisible:
    id: "forgot-password-success"
- takeScreenshot: "phase1-forgot-password"
