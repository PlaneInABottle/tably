appId: ${MAESTRO_APP_ID}
onFlowStart:
  - runFlow: ../shared/_OnFlowStart.yaml
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
  NEW_PASSWORD: ${NEW_PASSWORD}
---
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-submit-button"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Map"
    timeout: 30000
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
- tapOn:
    id: "settings-change-password-button"
- extendedWaitUntil:
    visible: "Change password"
    timeout: 30000
- tapOn:
    id: "change-password-input"
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: "change-password-confirm-input"
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "change-password-submit-button"
- assertVisible:
    id: "change-password-success"
- takeScreenshot: "phase5-change-password"
- tapOn:
    id: "change-password-back-button"
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-sign-out-button"
- assertVisible: "Sign out?"
- tapOn:
    text: "Confirm sign out"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${NEW_PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-submit-button"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "Map"
    timeout: 30000
