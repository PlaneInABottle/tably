appId: ${MAESTRO_APP_ID}
onFlowStart:
  # Note: _OnFlowStart.yaml runs `clearState: true` which is incompatible
  # with the Expo dev launcher. When running against a development build
  # launched via Metro, this flow assumes the user is not already signed
  # in OR that the prior `clearState: true` failed silently (in which case
  # the sign-in steps below will surface the sign-in screen). For IPA
  # builds the `onFlowStart` line is required and is therefore preserved.
  - runFlow: ../shared/_OnFlowStart.yaml
env:
  EMAIL: ${EMAIL}
  PASSWORD: ${PASSWORD}
  DISPLAY_NAME: ${DISPLAY_NAME}
---
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 30000
- tapOn:
    id: "sign-in-create-account-button"
- tapOn:
    id: "display-name-input"
- inputText: ${DISPLAY_NAME}
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-up-submit-button"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tab-map"
    timeout: 30000
# Phase 4: saved-location trigger moved to the Profile screen in
# commit 9668925; the Map FAB was removed in 9e9d580. Route through
# `tab-profile` → `profile-add-saved-location-button`.
- tapOn:
    id: "tab-profile"
- extendedWaitUntil:
    visible: "Saved locations"
    timeout: 15000
- swipe:
    start: 50%, 84%
    end: 50%, 38%
    duration: 500
- assertVisible: "Profile add saved location"
- tapOn: "Profile add saved location"
- tapOn:
    id: "location-picker-label-input"
- inputText: "Crescent Reef"
- pressKey: Enter
- extendedWaitUntil:
    notVisible: "return"
    timeout: 10000
- tapOn:
    id: "location-picker-save-button"
# After LocationPicker.goBack() the user is on Profile. The next step
# is on the Dive tab, so switch tabs (idempotent w.r.t. the testID wait).
- tapOn:
    id: "tab-dive"
- extendedWaitUntil:
    visible: "Dive event"
    timeout: 15000
- tapOn:
    id: "dive-event-create-button"
- extendedWaitUntil:
    visible: "Create dive event"
    timeout: 10000
- tapOn:
    id: "dive-event-title-input"
- inputText: "Blue Horizon Dive"
- pressKey: Enter
- extendedWaitUntil:
    notVisible: "return"
    timeout: 10000
- tapOn:
    id: "dive-event-description-input"
- inputText: "Meet at the harbor for a Maestro validation dive."
- tapOn:
    id: "dive-event-title-input"
- pressKey: Enter
- extendedWaitUntil:
    notVisible: "return"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "dive-event-selected-location"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "dive-event-save-button"
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: "dive-event-save-button"
- extendedWaitUntil:
    visible:
      id: "dive-event-success"
    timeout: 30000
- assertVisible: "Blue Horizon Dive"
- takeScreenshot: "phase3-dive-created"
- scrollUntilVisible:
    element:
      id: "dive-event-edit-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "dive-event-edit-button"
- tapOn:
    id: "dive-event-title-input"
- eraseText: 40
- inputText: "Updated Blue Horizon Dive"
- pressKey: Enter
- extendedWaitUntil:
    notVisible: "return"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "dive-event-save-button"
    direction: DOWN
    centerElement: true
    timeout: 10000
- tapOn:
    id: "dive-event-save-button"
- extendedWaitUntil:
    visible:
      id: "dive-event-success"
    timeout: 30000
- assertVisible: "Updated Blue Horizon Dive"
- takeScreenshot: "phase3-dive-updated"
- scrollUntilVisible:
    element:
      id: "dive-event-delete-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "dive-event-delete-button"
- tapOn: "Delete"
- scrollUntilVisible:
    element:
      id: "dive-event-success"
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "dive-event-success"
    timeout: 30000
- takeScreenshot: "phase3-dive-deleted"
- tapOn:
    id: "tab-settings"
- scrollUntilVisible:
    element:
      id: "settings-sign-out-button"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "settings-sign-out-button"
- tapOn: "Confirm sign out"
